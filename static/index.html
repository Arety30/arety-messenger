<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b141a">
<title>Arety Messenger</title>
<style>
:root {
  --bg: #0b141a; --panel: #111b21; --bar: #1f2c34; --line: #222d34; --text: #e9edef; --dim: #8696a0;
  --accent: #00a884; --out: #005c4b; --in: #202c33; --read: #53bdeb; --danger: #f15c6d; --chat-bg: #0b141a;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #fff; --panel: #fff; --bar: #008069; --line: #e9edef; --text: #111b21; --dim: #667781;
          --out: #d9fdd3; --in: #fff; --chat-bg: #efeae2; }
  header { color: #fff; } header .sub { color: #d9f0ea !important; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, textarea { font: inherit; color: inherit; }
#app { height: 100dvh; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; background: var(--panel); }
header { background: var(--bar); padding: 10px 12px; display: flex; align-items: center; gap: 12px; min-height: 58px; flex: none; }
header h1 { font-size: 20px; margin: 0; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .title { flex: 1; min-width: 0; cursor: pointer; }
header .title b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
header .sub { font-size: 12.5px; color: var(--dim); }
.icon { background: none; border: 0; padding: 8px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; color: inherit; }
.icon svg { width: 24px; height: 24px; fill: currentColor; }
.avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 19px; flex: none; }
.avatar.small { width: 38px; height: 38px; font-size: 16px; }
.avatar.big { width: 120px; height: 120px; font-size: 48px; margin: 26px auto 12px; }
main { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.search { padding: 8px 12px; }
.search input { width: 100%; border: 0; outline: 0; background: var(--bar); border-radius: 22px; padding: 10px 16px; }
@media (prefers-color-scheme: light) { .search input { background: #f0f2f5; } }
.row { display: flex; gap: 12px; padding: 10px 14px; align-items: center; cursor: pointer; }
.row:active { background: var(--line); }
.row .mid { flex: 1; min-width: 0; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: -10px; }
.row .top { display: flex; justify-content: space-between; gap: 8px; }
.row .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .time { font-size: 12px; color: var(--dim); flex: none; }
.row .time.new { color: var(--accent); }
.row .last { color: var(--dim); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.badge { background: var(--accent); color: #fff; border-radius: 12px; font-size: 12px; min-width: 20px; padding: 1px 6px; text-align: center; flex: none; }
.empty { text-align: center; color: var(--dim); padding: 48px 28px; }
.fab { position: fixed; right: max(18px, calc(50vw - 362px)); bottom: 22px; width: 58px; height: 58px; border-radius: 18px; border: 0;
  background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: 0 3px 10px #0006; cursor: pointer; }
.fab svg { width: 26px; height: 26px; fill: #fff; }
#chat main { background: var(--chat-bg); padding: 8px 10px 4px; display: flex; flex-direction: column; gap: 3px; }
.day { align-self: center; background: var(--bar); color: var(--dim); font-size: 12px; padding: 4px 10px; border-radius: 8px; margin: 8px 0 4px; }
@media (prefers-color-scheme: light) { .day { background: #fff; } }
.msg { max-width: 82%; padding: 6px 9px 4px; border-radius: 9px; position: relative; word-wrap: break-word; overflow-wrap: anywhere; white-space: pre-wrap; box-shadow: 0 1px .5px #0003; }
.msg.in { align-self: flex-start; background: var(--in); border-top-left-radius: 2px; }
.msg.out { align-self: flex-end; background: var(--out); border-top-right-radius: 2px; }
.msg img, .msg video { display: block; max-width: 100%; max-height: 320px; border-radius: 6px; margin-bottom: 4px; }
.msg a { color: var(--read); }
.msg .meta { float: right; font-size: 11px; color: var(--dim); margin: 6px 0 0 12px; white-space: nowrap; }
.msg .meta .read { color: var(--read); }
.msg .err { display: block; clear: both; color: var(--danger); font-size: 12.5px; margin-top: 3px; white-space: normal; }
.notice { background: var(--bar); color: var(--dim); font-size: 13px; padding: 9px 14px; text-align: center; flex: none; }
@media (prefers-color-scheme: light) { .notice { background: #fff7d6; color: #54656f; } }
.composer { display: flex; align-items: flex-end; gap: 6px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: var(--chat-bg); flex: none; }
.composer .box { flex: 1; display: flex; align-items: flex-end; background: var(--in); border-radius: 24px; padding: 2px 4px 2px 14px; min-width: 0; }
.composer textarea { flex: 1; border: 0; outline: 0; background: none; resize: none; padding: 10px 0; max-height: 120px; min-width: 0; }
.composer .sendbtn { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--accent); display: grid; place-items: center; flex: none; cursor: pointer; }
.composer .sendbtn svg { width: 22px; height: 22px; fill: #fff; }
.attached { font-size: 13px; color: var(--dim); padding: 4px 16px; background: var(--chat-bg); flex: none; }
.form { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.form label { font-size: 13px; color: var(--accent); display: flex; flex-direction: column; gap: 4px; }
.form input, .form textarea { background: none; border: 0; border-bottom: 2px solid var(--line); padding: 8px 2px; outline: 0; color: var(--text); }
.form input:focus, .form textarea:focus { border-color: var(--accent); }
.btn { background: var(--accent); color: #fff; border: 0; border-radius: 22px; padding: 11px 20px; font-weight: 600; cursor: pointer; }
.btn.danger { background: none; color: var(--danger); text-align: left; padding: 14px 18px; border-radius: 0; width: 100%; }
.center { text-align: center; }
.info { padding: 14px 18px; border-top: 8px solid var(--bg); }
.info small { color: var(--dim); display: block; margin-bottom: 2px; }
.hint { color: var(--dim); font-size: 13px; }
.error { color: var(--danger); font-size: 14px; min-height: 20px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const ICON = {
  back: '<svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>',
  send: '<svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>',
  clip: '<svg viewBox="0 0 24 24"><path d="M16.5 6v11.5a4 4 0 01-8 0V5a2.5 2.5 0 015 0v10.5a1 1 0 01-2 0V6H10v9.5a2.500 2.500 0 005 0V5a4 4 0 00-8 0v12.5a5.500 5.500 0 0011 0V6z"/></svg>',
  chat: '<svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 00-2 2v18l4-4h14a2 2 0 002-2V4a2 2 0 00-2-2zm-3 9h-4v4h-2v-4H7V9h4V5h2v4h4z"/></svg>',
  out: '<svg viewBox="0 0 24 24"><path d="M10 17l1.4-1.4L8.8 13H20v-2H8.800l2.600-2.600L10 7l-5 5zM4 5h8V3H4a2 2 0 00-2 2v14a2 2 0 002 2h8v-2H4z" transform="scale(-1,1) translate(-24,0)"/></svg>',
};
const COLORS = ["#00a884", "#53bdeb", "#e26ab6", "#ffa97a", "#a695e7", "#fe7c7f", "#6bcbef", "#7ccd7c", "#d1a05c"];

const state = { token: localStorage.getItem("token") || "", sender: localStorage.getItem("sender") || "",
                rev: 0, contacts: {}, messages: {}, clockSkew: 0, filter: "", file: null, drafts: {} };

async function api(path, opts = {}) {
  const headers = { Authorization: "Bearer " + state.token, ...(opts.json ? { "Content-Type": "application/json" } : {}) };
  const res = await fetch(path, { method: opts.method || (opts.json || opts.body ? "POST" : "GET"), headers,
                                  body: opts.json ? JSON.stringify(opts.json) : opts.body });
  if (res.status === 401) { logout(); throw new Error("login required"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Request failed (" + res.status + ")");
  return data;
}

const label = c => c.name || c.wa_name || c.number;
const avatar = (c, cls = "") => {
  const text = label(c), n = [...c.number].reduce((a, ch) => a + ch.charCodeAt(0), 0);
  const letter = /^[+\d]/.test(text) ? "#" : text.trim()[0].toUpperCase();
  return `<div class="avatar ${cls}" style="background:${COLORS[n % COLORS.length]}">${esc(letter)}</div>`;
};
const hhmm = ts => new Date(ts * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
function dayLabel(ts) {
  const d = new Date(ts * 1000), today = new Date(), y = new Date(Date.now() - 864e5);
  if (d.toDateString() === today.toDateString()) return "Today";
  if (d.toDateString() === y.toDateString()) return "Yesterday";
  return d.toLocaleDateString([], { day: "numeric", month: "short", year: "numeric" });
}
const listTime = ts => dayLabel(ts) === "Today" ? hhmm(ts) : dayLabel(ts) === "Yesterday" ? "Yesterday" : new Date(ts * 1000).toLocaleDateString([], { day: "numeric", month: "short" });
function ticks(m) {
  if (m.direction !== "out") return "";
  if (m.status === "failed") return " ⚠";
  if (m.status === "sending") return " 🕓";
  if (m.status === "read") return ' <span class="read">✓✓</span>';
  return m.status === "delivered" ? " ✓✓" : " ✓";
}
const preview = m => (m.direction === "out" ? ticks(m).trim() + " " : "") + esc(m.body || (m.media_type.startsWith("image") ? "📷 Photo" : m.media ? "📎 File" : ""));

// ---------------------------------------------------------------- screens

function route() {
  const [, page, arg] = decodeURIComponent(location.hash).split("/");
  if (!state.token) return showLogin();
  if (page === "chat" && state.contacts[arg]) return showChat(arg);
  if (page === "profile" && state.contacts[arg]) return showProfile(arg);
  if (page === "new") return showContactForm();
  if (page === "edit" && state.contacts[arg]) return showContactForm(state.contacts[arg]);
  showList();
}

function showLogin(error = "") {
  $("#app").innerHTML = `<header><h1>Arety Messenger</h1></header>
    <main><form class="form" id="login"><p class="hint">Sign in to chat from your WhatsApp business number.</p>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <div class="error">${esc(error)}</div><button class="btn">Sign in</button></form></main>`;
  $("#login").onsubmit = async e => {
    e.preventDefault();
    const res = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
                                           body: JSON.stringify({ password: e.target.password.value }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return showLogin(data.error || "Could not sign in");
    state.token = data.token; state.sender = data.sender;
    localStorage.setItem("token", data.token); localStorage.setItem("sender", data.sender);
    await sync(); route();
  };
}

function logout() {
  state.token = ""; localStorage.removeItem("token");
  Object.assign(state, { rev: 0, contacts: {}, messages: {} });
  location.hash = "#/"; showLogin();
}

function showList() {
  const app = $("#app");
  if (!$("#list", app)) {
    app.innerHTML = `<div id="list" style="display:contents"><header><h1>Arety Messenger</h1>
      <button class="icon" id="logout" title="Sign out">${ICON.out}</button></header>
      <div class="search"><input id="q" placeholder="Search" value="${esc(state.filter)}"></div><main id="rows"></main>
      <button class="fab" id="new" title="New contact">${ICON.chat}</button></div>`;
    $("#q").oninput = e => { state.filter = e.target.value; renderRows(); };
    $("#new").onclick = () => location.hash = "#/new";
    $("#logout").onclick = () => confirm("Sign out of Arety Messenger?") && logout();
  }
  renderRows();
}

function renderRows() {
  const rows = $("#rows"); if (!rows) return;
  const q = state.filter.trim().toLowerCase();
  const items = Object.values(state.contacts).map(c => {
    const msgs = state.messages[c.number] || [];
    return { c, last: msgs[msgs.length - 1], unread: msgs.filter(m => m.unread).length };
  }).filter(i => !q || (label(i.c) + " " + i.c.number + " " + i.c.wa_name).toLowerCase().includes(q))
    .sort((a, b) => (b.last?.ts || 0) - (a.last?.ts || 0) || label(a.c).localeCompare(label(b.c)));
  rows.innerHTML = items.length ? items.map(({ c, last, unread }) => `
    <div class="row" data-n="${esc(c.number)}">${avatar(c)}<div class="mid">
      <div class="top"><span class="name">${esc(label(c))}</span><span class="time ${unread ? "new" : ""}">${last ? listTime(last.ts) : ""}</span></div>
      <div class="top"><span class="last">${last ? preview(last) : esc(c.number)}</span>${unread ? `<span class="badge">${unread}</span>` : ""}</div>
    </div></div>`).join("")
    : `<div class="empty">${q ? "No chats match." : `No chats yet.<br><br>Add a contact with the button below. People can also message <b>${esc(state.sender)}</b> on WhatsApp and they will appear here.`}</div>`;
  rows.querySelectorAll(".row").forEach(r => r.onclick = () => location.hash = "#/chat/" + encodeURIComponent(r.dataset.n));
}

function showChat(number) {
  const c = state.contacts[number], app = $("#app");
  if ($("#chat", app)?.dataset.n !== number) {
    app.innerHTML = `<div id="chat" data-n="${esc(number)}" style="display:contents">
      <header><button class="icon" id="back">${ICON.back}</button><span id="av"></span>
        <div class="title" id="title"><b></b><span class="sub"></span></div></header>
      <main id="msgs"></main><div class="notice" id="notice" hidden></div><div class="attached" id="attached" hidden></div>
      <div class="composer"><div class="box"><textarea id="text" rows="1" placeholder="Message"></textarea>
        <button class="icon" id="clip" title="Attach">${ICON.clip}</button></div>
        <button class="sendbtn" id="send" title="Send">${ICON.send}</button>
        <input type="file" id="file" hidden accept="image/*,video/*,audio/*,application/pdf"></div></div>`;
    $("#back").onclick = () => history.length > 1 ? history.back() : (location.hash = "#/");
    $("#title").onclick = $("#av").onclick = () => location.hash = "#/profile/" + encodeURIComponent(number);
    const text = $("#text");
    text.value = state.drafts[number] || "";
    text.oninput = () => { state.drafts[number] = text.value; text.style.height = "auto"; text.style.height = text.scrollHeight + "px"; };
    $("#clip").onclick = () => $("#file").click();
    $("#file").onchange = e => { state.file = e.target.files[0] || null; renderAttached(); };
    $("#send").onclick = () => sendMessage(number);
    state.file = null; state.shown = "";
  }
  $("#av").innerHTML = avatar(c, "small");
  $("#title b").textContent = label(c);
  $("#title .sub").textContent = c.name || c.wa_name ? c.number : "tap for contact info";
  renderMessages(number);
  if ((state.messages[number] || []).some(m => m.unread)) api("/api/read", { json: { number } }).catch(() => {});
}

function renderAttached() {
  const el = $("#attached"); if (!el) return;
  el.hidden = !state.file;
  el.innerHTML = state.file ? `📎 ${esc(state.file.name)} &nbsp;<a href="#" id="unattach">remove</a>` : "";
  if (state.file) $("#unattach").onclick = e => { e.preventDefault(); state.file = null; $("#file").value = ""; renderAttached(); };
}

function renderMessages(number) {
  const box = $("#msgs"); if (!box) return;
  const msgs = state.messages[number] || [], c = state.contacts[number];
  const signature = msgs.map(m => m.id + m.status).join();
  if (signature !== state.shown) {
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120 || !state.shown;
    let day = "";
    box.innerHTML = msgs.map(m => {
      const d = dayLabel(m.ts), head = d !== day ? `<div class="day">${d}</div>` : ""; day = d;
      const src = `/api/media/${m.id}?t=${encodeURIComponent(state.token)}`;
      const media = !m.media ? "" : m.media_type.startsWith("image") ? `<a href="${src}" target="_blank"><img src="${src}" loading="lazy"></a>`
        : m.media_type.startsWith("video") ? `<video src="${src}" controls preload="metadata"></video>`
        : m.media_type.startsWith("audio") ? `<audio src="${src}" controls></audio>` : `<a href="${src}" target="_blank">📎 Open file</a><br>`;
      return `${head}<div class="msg ${m.direction}">${media}${esc(m.body)}<span class="meta">${hhmm(m.ts)}${ticks(m)}</span>${
        m.error ? `<span class="err">Not delivered: ${esc(m.error)}</span>` : ""}</div>`;
    }).join("") || `<div class="empty">No messages yet.</div>`;
    state.shown = signature;
    if (nearBottom) box.scrollTop = box.scrollHeight;
  }
  const now = Date.now() / 1000 + state.clockSkew, notice = $("#notice");
  const open = c.window_ends > now;
  notice.hidden = open;
  notice.textContent = c.window_ends ? "It has been over 24 hours since their last message. WhatsApp will only deliver your reply after they message you again."
    : "They have not messaged this number yet. WhatsApp only delivers your messages after they write to you first.";
}

async function sendMessage(number) {
  const text = $("#text"), body = text.value.trim(), file = state.file;
  if (!body && !file) return;
  text.value = ""; text.style.height = "auto"; delete state.drafts[number];
  state.file = null; $("#file").value = ""; renderAttached();
  try {
    if (file) {
      const form = new FormData(); form.append("body", body); form.append("file", file);
      await api(`/api/chats/${encodeURIComponent(number)}/send`, { body: form });
    } else await api(`/api/chats/${encodeURIComponent(number)}/send`, { json: { body } });
  } catch (e) { alert("Could not send: " + e.message); text.value = body; }
  sync();
}

function showProfile(number) {
  const c = state.contacts[number], msgs = state.messages[number] || [];
  $("#app").innerHTML = `<header><button class="icon" id="back">${ICON.back}</button><h1>Contact info</h1></header>
    <main><div class="center">${avatar(c, "big")}<h2 style="margin:0">${esc(label(c))}</h2><div class="hint" style="margin:4px 0 18px">${esc(c.number)}</div>
      <button class="btn" id="msg">Message</button> &nbsp; <button class="btn" id="edit" style="background:var(--bar)">Edit</button></div>
    <div class="info" style="margin-top:22px"><small>Name on WhatsApp</small>${esc(c.wa_name) || '<span class="hint">Shown after they message you</span>'}</div>
    <div class="info"><small>Notes</small>${esc(c.notes) || '<span class="hint">None</span>'}</div>
    <div class="info"><small>Messages</small>${msgs.length} total, ${msgs.filter(m => m.media).length} with media</div>
    <div class="info" style="padding:0"><button class="btn danger" id="del">Delete contact and chat</button></div></main>`;
  $("#back").onclick = () => history.back();
  $("#msg").onclick = () => location.hash = "#/chat/" + encodeURIComponent(number);
  $("#edit").onclick = () => location.hash = "#/edit/" + encodeURIComponent(number);
  $("#del").onclick = async () => {
    if (!confirm(`Delete ${label(c)} and all messages with them?`)) return;
    await api("/api/contacts/" + encodeURIComponent(number), { method: "DELETE" });
    delete state.contacts[number]; delete state.messages[number];
    location.hash = "#/";
  };
}

function showContactForm(c) {
  $("#app").innerHTML = `<header><button class="icon" id="back">${ICON.back}</button><h1>${c ? "Edit contact" : "New contact"}</h1></header>
    <main><form class="form" id="contact">
      <label>Name<input name="name" value="${esc(c?.name)}" placeholder="e.g. Ahmed" autocomplete="off"></label>
      <label>Phone number, with country code<input name="number" type="tel" value="${esc(c?.number)}" placeholder="++10000000000" ${c ? "readonly" : "required"}></label>
      <label>Notes<textarea name="notes" rows="2" placeholder="Optional">${esc(c?.notes)}</textarea></label>
      <div class="error" id="err"></div><button class="btn">Save</button></form></main>`;
  $("#back").onclick = () => history.back();
  $("#contact").onsubmit = async e => {
    e.preventDefault();
    const f = e.target;
    try {
      const saved = await api("/api/contacts", { json: { name: f.name.value, number: f.number.value, notes: f.notes.value } });
      await sync();
      location.replace("#/chat/" + encodeURIComponent(saved.number));
    } catch (err) { $("#err").textContent = err.message; }
  };
}

// ---------------------------------------------------------------- keeping up to date

async function sync() {
  if (!state.token) return;
  const data = await api("/api/sync?rev=" + state.rev);
  state.clockSkew = data.now - Date.now() / 1000;
  state.contacts = Object.fromEntries(data.contacts.map(c => [c.number, c]));
  for (const m of data.messages) {
    const list = state.messages[m.number] ||= [], i = list.findIndex(x => x.id === m.id);
    i >= 0 ? list[i] = m : list.push(m);
  }
  for (const n of Object.keys(state.messages)) if (!state.contacts[n]) delete state.messages[n];
  const changed = data.rev !== state.rev;
  state.rev = data.rev;
  const chat = $("#chat");
  if (chat && state.contacts[chat.dataset.n]) showChat(chat.dataset.n);
  else if ($("#list") && changed) renderRows();
}

window.addEventListener("hashchange", route);
(async () => {
  if (state.token) await sync().catch(() => {});
  route();
  setInterval(() => document.hidden || sync().catch(() => {}), 2500);
  document.addEventListener("visibilitychange", () => document.hidden || sync().catch(() => {}));
})();
</script>
</body>
</html>
